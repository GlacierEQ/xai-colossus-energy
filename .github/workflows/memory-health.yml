name: Memory Health Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 06:00 UTC to catch key rotation issues early
    - cron: '0 6 * * *'

jobs:
  memory-health:
    name: Energy Memory Layer Health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install httpx pinecone-client pytest python-dotenv

      - name: Run unit tests
        run: |
          ENERGY_MEMORY_ENABLED=false pytest src/memory/tests/ -v

      - name: Memory health check (degraded = warn, not fail)
        env:
          # These are optional — missing keys = degraded, not error
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          SUPERMEMORY_API_KEY: ${{ secrets.SUPERMEMORY_API_KEY }}
          ENERGY_MEMORY_ENABLED: 'true'
          COLOSSUS_GATEWAY_PATH: '../colossus-gateway'
        run: |
          python scripts/run_energy_memory_health.py --json || echo "::warning::Memory layer degraded — check PINECONE_API_KEY and SUPERMEMORY_API_KEY secrets"
