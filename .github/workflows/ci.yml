name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-quick-ci.yml@a6085dae73bb80e91b845fd4a0d2f73a9c6b985a
    with:
      repo_name: ${{ github.event.repository.name }}
      language: generic
      strict: true
      verify_script: scripts/ci/verify_portfolio_core.sh
      upload_artifacts: true
