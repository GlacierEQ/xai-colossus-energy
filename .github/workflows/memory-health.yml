name: Memory Health Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 06:00 UTC to catch key rotation issues early
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  memory-health:
    name: Energy Memory Layer Health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-memory.txt

      - name: Install declared memory dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-memory.txt

      - name: Run memory unit tests
        run: ENERGY_MEMORY_ENABLED=false python -m pytest src/memory/tests/ -v

      - name: Memory health check (degraded = warn, not fail)
        env:
          # These are optional — missing keys = degraded, not error
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          SUPERMEMORY_API_KEY: ${{ secrets.SUPERMEMORY_API_KEY }}
          ENERGY_MEMORY_ENABLED: 'true'
          COLOSSUS_GATEWAY_PATH: '../colossus-gateway'
        run: |
          python scripts/run_energy_memory_health.py --json || echo "::warning::Memory layer degraded — check PINECONE_API_KEY and SUPERMEMORY_API_KEY secrets"
